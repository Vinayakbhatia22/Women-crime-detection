[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safecrime"
version = "1.0.0"
authors = [
    { name = "SafeVision Analytics Team", email = "contact@safevision.org" }
]
description = "A Python Data Science and Machine Learning Library for Crimes Against Women Analytics"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]
keywords = [
    "data-science",
    "machine-learning",
    "crime-analysis",
    "ncrb",
    "predictive-modeling",
    "clustering",
    "anomaly-detection",
    "women-safety"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.urls]
"Homepage" = "https://github.com/Vinayakbhatia22/Women-crime-detection"
"Bug Tracker" = "https://github.com/Vinayakbhatia22/Women-crime-detection/issues"
